<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="/ffmpeg-icon.png" />
    <meta charset="UTF-8" />
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const debounce = (callback, wait = 250) => {
        let timer;
        let last_call = 0;
        return (...args) => {
          clearTimeout(timer);
          const now = Date.now(),
            time_from_last_call = now - last_call;

          if (time_from_last_call > wait) {
            last_call = now;
            callback(...args);
          } else {
            timer = setTimeout(() => {
              last_call = now;
              callback(...args);
            }, wait);
          }
        };
      };

      console.log(window.location.pathname);
      const [title] = decodeURIComponent(window.location.pathname).replace('.job', '').split('/').slice(-1);
      document.title = title;

      const scrollToEnd = debounce(() => document.getElementById('end').scrollIntoView());

      document.addEventListener('DOMContentLoaded', () => {
        const tailing = document.getElementById('tailing');
        const socket = io();
        socket.on('connect', () => {
          console.log('connected');

          socket.emit('tail', window.location.pathname);
          tailing.replaceChildren();
        });
        socket.on('newLine', data => {
          tailing.append(document.createTextNode(data.line));
          scrollToEnd();
        });
      });
    </script>
  </head>

  <body>
    <pre id="tailing" style="background-color: antiquewhite"></pre>
    <div id="end"></div>
  </body>
</html>
