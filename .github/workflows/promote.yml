name: Promote stable image

on:
  workflow_dispatch:
    inputs:
      digest:
        description: 'Tested image digest (sha256: followed by 64 lowercase hex characters)'
        required: true
        type: string
      version:
        description: 'Stable version tag (vMAJOR.MINOR.PATCH, for example v1.0.0)'
        required: true
        type: string
      approved:
        description: 'I approve promoting this tested digest to the version tag and latest'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ghcr-stable
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      inputs.approved &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.repository == 'mlaflamm/ffmpeg-batch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/mlaflamm/ffmpeg-batch
      DIGEST: ${{ inputs.digest }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote exact digest without rebuilding
        run: bash .github/scripts/promote-image.sh
